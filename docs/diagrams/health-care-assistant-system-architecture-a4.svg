<svg xmlns="http://www.w3.org/2000/svg" width="1169" height="827" viewBox="0 0 1169 827">
  <defs>
    <style>
      .title{font:700 30px Arial,"Noto Sans TC",sans-serif;fill:#0f172a}
      .sub{font:400 13px Arial,"Noto Sans TC",sans-serif;fill:#475569}
      .band-title{font:700 16px Arial,"Noto Sans TC",sans-serif}
      .node-title{font:700 13px Arial,"Noto Sans TC",sans-serif;fill:#0f172a}
      .node{font:400 11px Arial,"Noto Sans TC",sans-serif;fill:#334155}
      .small{font:400 10px Arial,"Noto Sans TC",sans-serif;fill:#475569}
      .legend{font:400 12px Arial,"Noto Sans TC",sans-serif;fill:#334155}
      .security{font:700 13px Arial,"Noto Sans TC",sans-serif;fill:#881337}
      .arrow{fill:none;stroke-width:2;marker-end:url(#arrow)}
      .dash{stroke-dasharray:7 5}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1169" height="827" fill="#f8fafc"/>
  <text x="42" y="55" class="title">Health Care Assistant 系統架構圖</text>
  <text x="44" y="82" class="sub">Next.js 14 + Supabase + Anthropic + Cloudflare R2｜A4 Landscape｜版本 1.3.1</text>
  <rect x="760" y="28" width="360" height="48" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="775" y="49" class="legend">圖例：實線＝同步請求 / 回應</text>
  <text x="775" y="67" class="legend">虛線＝檔案或非同步資料流　紅線＝隱私與安全控管</text>

  <rect x="40" y="110" width="210" height="610" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="55" y="137" class="band-title" fill="#075985">使用者互動層</text>
  <rect x="285" y="110" width="245" height="610" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="300" y="137" class="band-title" fill="#065f46">Next.js Route Handlers / API 層</text>
  <rect x="565" y="110" width="250" height="610" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="580" y="137" class="band-title" fill="#9a3412">核心服務與醫療資料處理</text>
  <rect x="850" y="110" width="279" height="610" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="865" y="137" class="band-title" fill="#4c1d95">資料庫 / 儲存 / 外部服務</text>

  <g id="client">
    <rect x="70" y="150" width="150" height="62" rx="8" fill="#fff" stroke="#0284c7"/>
    <text x="145" y="176" text-anchor="middle" class="node-title">使用者</text>
    <text x="145" y="195" text-anchor="middle" class="node">醫護 / 管理員 / 客戶</text>
    <rect x="70" y="245" width="150" height="72" rx="8" fill="#bae6fd" stroke="#0369a1"/>
    <text x="145" y="273" text-anchor="middle" class="node-title">Auth UI</text>
    <text x="145" y="292" text-anchor="middle" class="node">登入 / 註冊 / OTP</text>
    <text x="145" y="308" text-anchor="middle" class="node">Google Login</text>
    <rect x="70" y="345" width="150" height="72" rx="8" fill="#bae6fd" stroke="#0369a1"/>
    <text x="145" y="373" text-anchor="middle" class="node-title">Chat UI</text>
    <text x="145" y="392" text-anchor="middle" class="node">ChatWindow / ChatInput</text>
    <text x="145" y="408" text-anchor="middle" class="node">MessageList</text>
    <rect x="70" y="445" width="150" height="74" rx="8" fill="#bae6fd" stroke="#0369a1"/>
    <text x="145" y="473" text-anchor="middle" class="node-title">模型與任務控制</text>
    <text x="145" y="492" text-anchor="middle" class="node">Model / Workload</text>
    <text x="145" y="508" text-anchor="middle" class="node">Function / Credits</text>
    <rect x="70" y="548" width="150" height="84" rx="8" fill="#bae6fd" stroke="#0369a1"/>
    <text x="145" y="576" text-anchor="middle" class="node-title">FHIR 匯入視窗</text>
    <text x="145" y="595" text-anchor="middle" class="node">JSON / XML 預覽</text>
    <text x="145" y="611" text-anchor="middle" class="node">合併、去識別</text>
  </g>

  <g id="api">
    <rect x="320" y="150" width="175" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="407" y="177" text-anchor="middle" class="node-title">/api/auth/*</text>
    <text x="407" y="196" text-anchor="middle" class="node">login / register / otp</text>
    <text x="407" y="212" text-anchor="middle" class="node">google / me</text>
    <rect x="320" y="260" width="175" height="92" rx="8" fill="#bbf7d0" stroke="#15803d"/>
    <text x="407" y="288" text-anchor="middle" class="node-title">POST /api/chat</text>
    <text x="407" y="307" text-anchor="middle" class="node">session 驗證、去識別</text>
    <text x="407" y="323" text-anchor="middle" class="node">扣 credits、寫訊息</text>
    <text x="407" y="339" text-anchor="middle" class="node">呼叫 AI</text>
    <rect x="320" y="390" width="175" height="88" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="407" y="418" text-anchor="middle" class="node-title">/api/chat/upload-token</text>
    <text x="407" y="436" text-anchor="middle" class="node-title">/api/chat/upload</text>
    <text x="407" y="456" text-anchor="middle" class="node">安全檢查、簽名 URL</text>
    <rect x="320" y="512" width="175" height="86" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="407" y="540" text-anchor="middle" class="node-title">/api/admin/*</text>
    <text x="407" y="559" text-anchor="middle" class="node">客戶審核、模型管理</text>
    <text x="407" y="575" text-anchor="middle" class="node">credits 調整、設定</text>
    <rect x="320" y="625" width="175" height="62" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="407" y="650" text-anchor="middle" class="node-title">/api/customer-settings</text>
    <text x="407" y="670" text-anchor="middle" class="node">conversations / credits / models</text>
  </g>

  <g id="domain">
    <rect x="600" y="150" width="180" height="78" rx="8" fill="#fed7aa" stroke="#ea580c"/>
    <text x="690" y="177" text-anchor="middle" class="node-title">Auth Services</text>
    <text x="690" y="196" text-anchor="middle" class="node">session / password / otp</text>
    <text x="690" y="212" text-anchor="middle" class="node">admin / google-oauth</text>
    <rect x="600" y="255" width="180" height="92" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="690" y="283" text-anchor="middle" class="node-title" fill="#7f1d1d">隱私去識別</text>
    <text x="690" y="302" text-anchor="middle" class="node">姓名、身分證、電話</text>
    <text x="690" y="318" text-anchor="middle" class="node">Email、生日、地址</text>
    <text x="690" y="334" text-anchor="middle" class="node">病歷號、檔名</text>
    <rect x="600" y="375" width="180" height="82" rx="8" fill="#fed7aa" stroke="#ea580c"/>
    <text x="690" y="403" text-anchor="middle" class="node-title">Credits &amp; Pricing</text>
    <text x="690" y="422" text-anchor="middle" class="node">查價、扣點、退款</text>
    <text x="690" y="438" text-anchor="middle" class="node">交易紀錄</text>
    <rect x="600" y="485" width="180" height="105" rx="8" fill="#fed7aa" stroke="#ea580c"/>
    <text x="690" y="513" text-anchor="middle" class="node-title">FHIR Processing</text>
    <text x="690" y="532" text-anchor="middle" class="node">parser / formatter / merge</text>
    <text x="690" y="548" text-anchor="middle" class="node">Patient, Observation</text>
    <text x="690" y="564" text-anchor="middle" class="node">DiagnosticReport</text>
    <text x="690" y="580" text-anchor="middle" class="node">Condition, Medication</text>
    <rect x="600" y="620" width="180" height="82" rx="8" fill="#fdba74" stroke="#c2410c"/>
    <text x="690" y="648" text-anchor="middle" class="node-title">AI Request Orchestrator</text>
    <text x="690" y="667" text-anchor="middle" class="node">lib/mcp/client.ts</text>
    <text x="690" y="683" text-anchor="middle" class="node">workload → skills / prompt</text>
  </g>

  <g id="data">
    <rect x="885" y="142" width="205" height="125" rx="12" fill="#ddd6fe" stroke="#7c3aed"/>
    <text x="987" y="169" text-anchor="middle" class="node-title">Supabase PostgreSQL</text>
    <text x="987" y="190" text-anchor="middle" class="node">customers, sessions, otp_tokens</text>
    <text x="987" y="206" text-anchor="middle" class="node">chat_conversations, chat_messages</text>
    <text x="987" y="222" text-anchor="middle" class="node">model_pricing, credits_transactions</text>
    <text x="987" y="238" text-anchor="middle" class="node">customer_settings, rate_limits</text>
    <rect x="885" y="315" width="205" height="100" rx="12" fill="#e9d5ff" stroke="#9333ea"/>
    <text x="987" y="343" text-anchor="middle" class="node-title">Cloudflare R2</text>
    <text x="987" y="363" text-anchor="middle" class="node">聊天附件、對話紀錄 Markdown</text>
    <text x="987" y="379" text-anchor="middle" class="node">Public URL / Worker Proxy</text>
    <rect x="885" y="460" width="205" height="82" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="987" y="489" text-anchor="middle" class="node-title">Anthropic Messages API</text>
    <text x="987" y="508" text-anchor="middle" class="node">Claude 模型、文字 / 影像分析</text>
    <text x="987" y="524" text-anchor="middle" class="node">臨床輔助回應</text>
    <rect x="885" y="578" width="95" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="932" y="606" text-anchor="middle" class="node-title">Google OAuth</text>
    <text x="932" y="625" text-anchor="middle" class="small">帳號連結</text>
    <rect x="995" y="578" width="95" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="1042" y="606" text-anchor="middle" class="node-title">Resend Email</text>
    <text x="1042" y="625" text-anchor="middle" class="small">OTP / 通知</text>
  </g>

  <path d="M220 281 H320" class="arrow" stroke="#059669"/>
  <path d="M220 381 H320" class="arrow" stroke="#059669"/>
  <path d="M220 434 H320" class="arrow dash" stroke="#059669"/>
  <path d="M220 590 H600" class="arrow" stroke="#ea580c"/>
  <path d="M495 185 H600" class="arrow" stroke="#ea580c"/>
  <path d="M495 306 H600" class="arrow" stroke="#dc2626" stroke-width="3"/>
  <path d="M495 306 C555 306 545 416 600 416" class="arrow" stroke="#ea580c"/>
  <path d="M690 347 V620" class="arrow" stroke="#ea580c"/>
  <path d="M690 590 V620" class="arrow" stroke="#ea580c"/>
  <path d="M780 189 H885" class="arrow" stroke="#7c3aed"/>
  <path d="M780 416 C835 416 835 205 885 205" class="arrow" stroke="#7c3aed"/>
  <path d="M495 434 H885" class="arrow dash" stroke="#7c3aed"/>
  <path d="M780 661 H885" class="arrow" stroke="#7c3aed"/>
  <path d="M885 501 C835 501 835 306 495 306" class="arrow" stroke="#15803d"/>
  <path d="M780 189 C835 189 835 610 885 610" class="arrow" stroke="#d97706"/>
  <path d="M780 189 C835 189 850 610 995 610" class="arrow" stroke="#d97706"/>
  <path d="M495 656 C650 656 725 205 885 205" class="arrow" stroke="#7c3aed"/>

  <text x="250" y="275" class="small">Auth APIs</text>
  <text x="238" y="374" class="small">POST /api/chat</text>
  <text x="240" y="426" class="small">附件上傳</text>
  <text x="510" y="297" class="small" fill="#7f1d1d">PHI Redaction</text>
  <text x="796" y="655" class="small">Messages API</text>

  <text x="44" y="713" class="node-title">核心聊天請求生命週期</text>
  <rect x="225" y="696" width="904" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="240" y="718" class="legend">1 UI 送出訊息 / FHIR / 附件 → 2 /api/chat 驗證 session → 3 隱私去識別 → 4 查模型價格並扣 credits → 5 寫入 Supabase → 6 MCP 組 prompt → 7 Anthropic 回應 → 8 回寫 UI</text>
  <rect x="40" y="745" width="1089" height="45" rx="8" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="58" y="773" class="security">安全治理：Session Cookie + JWT Secret、RLS Policies、Rate Limits、10KB Chat Request Limit、Upload Security、PHI Redaction before LLM</text>
</svg>
