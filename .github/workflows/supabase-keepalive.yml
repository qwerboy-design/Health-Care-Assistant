name: Supabase keepalive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Reach Supabase through PostgREST
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo '::error::Set both required GitHub secrets: SUPABASE_URL and SUPABASE_ANON_KEY.'
            exit 1
          fi

          # The keepalive RPC returns only server time and accesses no tables.
          # Keep the response in memory and silence diagnostics to avoid data leaks.
          curl_exit=0
          response="$(curl --silent \
            --request POST \
            --retry 3 \
            --retry-max-time 120 \
            --connect-timeout 10 \
            --max-time 30 \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --write-out '\n%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            2>/dev/null)" || curl_exit=$?

          http_status="${response##*$'\n'}"
          [[ "$http_status" =~ ^[0-9]{3}$ ]] || http_status=000
          printf 'HTTP status: %s\n' "$http_status" | tee -a "$GITHUB_STEP_SUMMARY"

          # Log only a validated SQLSTATE/PostgREST code, never messages or rows.
          if [[ "$http_status" == [45][0-9][0-9] ]]; then
            response_body="${response%$'\n'*}"
            postgrest_code="$(printf '%s' "$response_body" | jq -rse '
              last | .code? // empty | select(type == "string")
              | select(test("^(PGRST[0-9]{3}|[0-9A-Z]{5})$"))
            ' 2>/dev/null)" || postgrest_code=''
            if [[ -n "$postgrest_code" ]]; then
              printf 'PostgREST error code: %s\n' "$postgrest_code" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # Omit --fail so error codes can be parsed safely; only 2xx is success.
          # A 4xx indicates misconfiguration of the keepalive RPC or credentials.
          if (( curl_exit != 0 )) || [[ "$http_status" != 2[0-9][0-9] ]]; then
            echo "::error::Supabase keepalive failed (HTTP ${http_status}, curl exit ${curl_exit})."
            exit 1
          fi
